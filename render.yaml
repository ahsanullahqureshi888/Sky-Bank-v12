services:
  - type: web
    name: sky-banking-backend
    env: docker
    plan: free
    dockerCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set this securely in the Render dashboard
      - key: PORT
        value: "8000"
