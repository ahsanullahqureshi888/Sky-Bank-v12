name: Sky Banking Backend Deployment & Status Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Unit Tests
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Update GitHub Deployment Status to Success
        uses: chrnorm/deployment-status@v2
        if: success()
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          target_url: https://sky-banking-backend.onrender.com
          state: "success"
          deployment_id: ${{ github.event.deployment.id }}
          environment: "main - sky-banking-backend"
          description: "Sky Banking FastAPI Backend built and deployed successfully."
